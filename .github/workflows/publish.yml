name: Publish

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bump-version
      - run: pnpm publish --no-git-checks
        continue-on-error: true
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 🔨 Bump version
          commit_author: StarryBlueSky-bot <97773209+StarryBlueSky-bot@users.noreply.github.com>
